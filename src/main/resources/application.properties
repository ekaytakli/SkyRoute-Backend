spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flightticketsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# iyzico Sandbox ödeme ortamının adresi.
iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}

# Sandbox hesabından alınacak API anahtarları.
# Gerçek anahtarları GitHub'a commit etme.
iyzico.api-key=${IYZICO_API_KEY}
iyzico.secret-key=${IYZICO_SECRET_KEY}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
